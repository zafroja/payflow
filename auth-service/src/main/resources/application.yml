server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/authdb
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # use Flyway/Liquibase migrations in production
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:cGF5Zmxvdy1kZW1vLXNlY3JldC1rZXktY2hhbmdlLW1lLTI1Ni1iaXQtbWluaW11bQ==}
    ttl: PT30M

payflow:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@12345}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
