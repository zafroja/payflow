server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: transaction-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/transactiondb
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
    hikari:
      maximum-pool-size: 20      # > transfer executor max threads (12) + request threads using the DB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update           # use Flyway/Liquibase migrations in production
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  cloud:
    openfeign:
      client:
        config:
          account-service:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

payflow:
  internal:
    api-key: ${INTERNAL_API_KEY:local-internal-key-change-me}
  transfer:
    max-amount: 25000.00
    max-per-minute: 30
    max-bulk-items: 100
    bulk-item-timeout: 10s
    retry-pending-after: 30s
    max-attempts: 10
    reporting-zone: America/Toronto
    reconcile-interval: PT30S

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.payflow.transaction.exception.TransferRejectedException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
