apiVersion: v1
kind: ConfigMap
metadata:
  name: payflow-config
  namespace: payflow
data:
  EUREKA_URL: http://discovery-server:8761/eureka
  DB_HOST: postgres
  DB_USER: payflow
  REDIS_HOST: redis
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
---
# Demo values only. In a real cluster create this from a vault (External Secrets, Sealed Secrets...)
apiVersion: v1
kind: Secret
metadata:
  name: payflow-secrets
  namespace: payflow
type: Opaque
stringData:
  DB_PASSWORD: payflow
  JWT_SECRET: cGF5Zmxvdy1kZW1vLXNlY3JldC1rZXktY2hhbmdlLW1lLTI1Ni1iaXQtbWluaW11bQ==
  INTERNAL_API_KEY: change-me-internal-key
  ADMIN_PASSWORD: Admin@12345
