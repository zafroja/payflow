apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: payflow
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: payflow
  labels: { app: api-gateway, app.kubernetes.io/part-of: payflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime deploys
  template:
    metadata:
      labels: { app: api-gateway, tier: edge }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api-gateway
          image: payflow/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: payflow-config }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: payflow-secrets, key: JWT_SECRET } }
          readinessProbe:      # traffic only once Spring says it is ready
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:       # restart if the JVM is wedged
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
          lifecycle:
            preStop:           # give the load balancer time to stop routing before shutdown
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
# Only the gateway is reachable from outside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payflow
  namespace: payflow
spec:
  ingressClassName: nginx
  rules:
    - host: payflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8080 } }
