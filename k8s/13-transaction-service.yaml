apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: payflow
spec:
  selector: { app: transaction-service }
  ports: [{ port: 8083, targetPort: 8083 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: payflow
  labels: { app: transaction-service, app.kubernetes.io/part-of: payflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: transaction-service }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime deploys
  template:
    metadata:
      labels: { app: transaction-service, tier: backend }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
      containers:
        - name: transaction-service
          image: payflow/transaction-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: payflow-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payflow-secrets, key: DB_PASSWORD } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: payflow-secrets, key: INTERNAL_API_KEY } }
          readinessProbe:      # traffic only once Spring says it is ready
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:       # restart if the JVM is wedged
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 60
            periodSeconds: 15
          lifecycle:
            preStop:           # give the load balancer time to stop routing before shutdown
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
