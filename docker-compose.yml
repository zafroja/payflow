name: payflow

x-service-env: &service-env
  EUREKA_URL: http://discovery-server:8761/eureka
  DB_HOST: postgres
  DB_USER: payflow
  DB_PASSWORD: ${DB_PASSWORD:-payflow}
  REDIS_HOST: redis
  JWT_SECRET: ${JWT_SECRET:-cGF5Zmxvdy1kZW1vLXNlY3JldC1rZXktY2hhbmdlLW1lLTI1Ni1iaXQtbWluaW11bQ==}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-internal-key-change-me}

x-service-deps: &service-deps
  discovery-server: { condition: service_healthy }
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payflow}
      POSTGRES_DB: payflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]   # handy for: redis-cli keys 'payflow:*'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    image: payflow/discovery-server:1.0.0
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness || exit 1"]
      interval: 10s
      start_period: 40s
      retries: 20

  auth-service:
    build: { context: ., args: { MODULE: auth-service } }
    image: payflow/auth-service:1.0.0
    environment:
      <<: *service-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on: *service-deps
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      start_period: 60s
      retries: 20

  account-service:
    build: { context: ., args: { MODULE: account-service } }
    image: payflow/account-service:1.0.0
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      start_period: 60s
      retries: 20

  transaction-service:
    build: { context: ., args: { MODULE: transaction-service } }
    image: payflow/transaction-service:1.0.0
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 10s
      start_period: 60s
      retries: 20

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    image: payflow/api-gateway:1.0.0
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-cGF5Zmxvdy1kZW1vLXNlY3JldC1rZXktY2hhbmdlLW1lLTI1Ni1iaXQtbWluaW11bQ==}
    depends_on:
      discovery-server: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
