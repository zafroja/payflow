apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payflow
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# Redis holds only cache, rate-limit and velocity counters, so an ephemeral Deployment is acceptable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: data }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
