server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/accountdb
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
    hikari:
      maximum-pool-size: 10
      # Postgres ignores JPA's lock.timeout hint, so cap row-lock waits at connection level
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    open-in-view: false            # no lazy loading from controllers / JSON rendering
    hibernate:
      ddl-auto: update             # use Flyway/Liquibase migrations in production
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  cache:
    type: redis

payflow:
  account:
    max-accounts-per-customer: 5
    max-single-deposit: 50000.00
    default-currency: CAD
  internal:
    api-key: ${INTERNAL_API_KEY:local-internal-key-change-me}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
